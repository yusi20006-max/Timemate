<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
<title id="title">TimeMate — three color themes</title>
<defs>
 <linearGradient id="ocean" x2="1" y2="1"><stop stop-color="#071b46"/><stop offset="1" stop-color="#25115c"/></linearGradient>
 <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#32101f"/><stop offset="1" stop-color="#64143e"/></linearGradient>
 <linearGradient id="forest" x2="1" y2="1"><stop stop-color="#062d2a"/><stop offset="1" stop-color="#075347"/></linearGradient>
</defs>
<rect width="1200" height="360" rx="28" fill="#080d20"/>
<g font-family="Arial,sans-serif">
