name: TimeMate CI and APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Unit tests, lint and APK builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Validate release signing secrets and prepare keystore
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: ${name}"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/timemate-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          keytool -list -keystore "$KEYSTORE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          # Only the non-sensitive temporary file path is persisted between steps.
          printf 'ANDROID_KEYSTORE_PATH=%s\\n' "$KEYSTORE" >> "$GITHUB_ENV"

      - name: Validate bundled official Tehran dataset
        run: python3 tools/prayer-times/validate_tehran_asset.py

      - name: Run unit tests, lint and build both variants
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify bundled Tehran asset inside both APKs
        run: python3 tools/prayer-times/validate_tehran_apk.py

      - name: Verify signed release APK and pinned certificate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          SIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\\n' "$SIGNER_OUTPUT"

          ACTUAL_SHA256="$(printf '%s\\n' "$SIGNER_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SHA256="3e0e0cfe328fa05172bb2419cbefc971debd599f3eb0aa636c306d46ab0bb3e1"

          if [[ -z "$ACTUAL_SHA256" || "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::APK signer certificate fingerprint mismatch."
            exit 1
          fi

          cp "$APK" "TimeMate-${GITHUB_REF_NAME}.apk"

      - name: Remove temporary signing keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/timemate-upload.jks"

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TimeMate-APKs-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            TimeMate-v*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: TimeMate-APKs-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TimeMate ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/TimeMate-${{ github.ref_name }}.apk
          body: |
            TimeMate Android release.

            - Signed release APK.
            - Official Tehran 1405 prayer times bundled for offline use.
            - APK signature is verified in CI against the release certificate fingerprint.
